
name: FreshFarm CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: freshfarm-frontend
          path: dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freshfarm-frontend
          path: dist/

      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_PRIVATE_KEY_B64 }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/freshfarm_key
          chmod 600 ~/.ssh/freshfarm_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with automatic rollback
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -rlz --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/freshfarm_key" \
            dist/ "$EC2_USER@$EC2_HOST:/var/www/freshfarm-deploy/new-release/"

          ssh -i ~/.ssh/freshfarm_key "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          WEB=/var/www/html
          BASE=/var/www/freshfarm-deploy
          BACKUPS=$BASE/backups
          NEW=$BASE/new-release
          STAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP=$BACKUPS/frontend-$STAMP.tar.gz
          TEMP=$(mktemp -d)

          cleanup() {
            rm -rf "$TEMP" "$NEW"
          }

          rollback() {
            local deploy_status=$?
            trap - ERR
            echo "Deployment failed. Restoring previous website."
            if [ -f "$BACKUP" ] && tar -xzf "$BACKUP" -C "$TEMP" &&
              sudo -n rsync -rl --delete "$TEMP/" "$WEB/"; then
              echo "Rollback completed."
            else
              echo "Rollback failed. Check sudo access and the deployment logs."
            fi
            cleanup
            exit "$deploy_status"
          }

          trap rollback ERR

          mkdir -p "$BACKUPS"
          tar -czf "$BACKUP" -C "$WEB" .

          sudo -n rsync -rl --delete "$NEW/" "$WEB/"

          curl -fsS http://127.0.0.1/ -o /dev/null

          trap - ERR
          cleanup

          echo "Deployment successful."

          ls -1t "$BACKUPS"/frontend-*.tar.gz |
            tail -n +6 | xargs -r rm --
          REMOTE
