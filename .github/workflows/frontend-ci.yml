
name: FreshFarm CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: freshfarm-frontend
          path: dist/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: freshfarm-frontend
          path: dist/

      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.EC2_SSH_PRIVATE_KEY_B64 }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/freshfarm_key
          chmod 600 ~/.ssh/freshfarm_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Backup current website
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/freshfarm_key "$EC2_USER@$EC2_HOST" '
            set -e
            BACKUP_DIR=/var/www/freshfarm-deploy/backups
            mkdir -p "$BACKUP_DIR"
            chmod 755 "$BACKUP_DIR"
            BACKUP="$BACKUP_DIR/frontend-$(date +%Y%m%d-%H%M%S).tar.gz"
            tar -czf "$BACKUP" -C /var/www/html .
            echo "Backup created: $BACKUP"
          '

      - name: Deploy and verify with automatic rollback
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -rlz --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/freshfarm_key" \
            dist/ "$EC2_USER@$EC2_HOST:/var/www/html/"

          ssh -i ~/.ssh/freshfarm_key "$EC2_USER@$EC2_HOST" '
            set -e
            BACKUP_DIR=/var/www/freshfarm-deploy/backups
            LATEST_BACKUP=$(ls -1t "$BACKUP_DIR"/frontend-*.tar.gz | head -n 1)

            if curl -fsS http://127.0.0.1/ -o /dev/null; then
              echo "Deployment health check passed."
              ls -1t "$BACKUP_DIR"/frontend-*.tar.gz | tail -n +6 | xargs -r rm --
            else
              echo "Health check failed. Rolling back."

              TEMP_DIR=$(mktemp -d)
              tar -xzf "$LATEST_BACKUP" -C "$TEMP_DIR"
              rsync -rl --delete "$TEMP_DIR/" /var/www/html/
              rm -rf "$TEMP_DIR"

              echo "Previous frontend restored."
              exit 1
            fi
          '
